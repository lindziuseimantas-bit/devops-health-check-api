name: serverless-health-check-ci-cd

on:
  pull_request:
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - prod
        default: staging
      apply:
        description: "Apply the Terraform plan"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
  APPLY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true') }}
  TF_IN_AUTOMATION: "true"

jobs:
  validate-and-scan:
    name: Validate and security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Scan Terraform for misconfigurations
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan Lambda dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r lambda/requirements.txt

  deploy:
    name: Plan and deploy
    runs-on: ubuntu-latest
    needs: validate-and-scan
    if: github.event_name != 'pull_request'
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Create Lambda build directory
        run: mkdir -p terraform/.build

      - name: Terraform init with remote state
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=health-check/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ID }}"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan

      - name: Terraform apply
        if: env.APPLY == 'true'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform outputs
        if: env.APPLY == 'true'
        working-directory: terraform
        run: terraform output
