name: serverless-health-check-ci-cd

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      apply:
        description: "Apply Terraform changes"
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
  APPLY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true') }}
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.2"
  PYTHON_VERSION: "3.12"

jobs:
  validate-and-security-scan:
    name: Validate and security scan
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Install Lambda dependencies for scanning
        working-directory: lambda
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Trivy IaC security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  plan-and-deploy:
    name: Plan and deploy
    runs-on: ubuntu-latest
    needs: validate-and-security-scan
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}

    defaults:
      run:
        shell: bash

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
      TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=health-check/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${TF_STATE_KMS_KEY_ID}"

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out="${ENVIRONMENT}.tfplan"

      - name: Terraform apply
        if: env.APPLY == 'true'
        working-directory: terraform
        run: terraform apply -auto-approve "${ENVIRONMENT}.tfplan"

      - name: Show Terraform outputs
        if: env.APPLY == 'true'
        working-directory: terraform
        run: terraform output